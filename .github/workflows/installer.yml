name: Build installer

# Собирает на Windows всё, что нужно для скачивания, из готовых программ в .github/installer/Klira_<версия>_binaries.zip:
#   downloads/Klira_Setup_<версия>.exe        - один установщик для Windows x64, x86 (32 бит) и ARM64
#   downloads/Klira_<версия>_x64.zip / _x86.zip / _arm64.zip - переносные версии (распаковал и запустил)
#   downloads/latest.json, SHA256SUMS.txt     - номер последней версии и контрольные суммы (по ним Klira обновляется сама)
# Библиотеку WebView2Loader.dll для каждой архитектуры берём из официального пакета Microsoft.Web.WebView2 (NuGet).
# Результат кладётся в папку downloads/ этого репозитория и дублируется в Artifacts запуска.
# Выпуски (Releases) этот процесс не меняет.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/installer/**'
      - '.github/workflows/installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the programs
        shell: pwsh
        run: |
          $ver = (Get-Content .github/installer/VERSION).Trim()
          Expand-Archive ".github/installer/Klira_${ver}_binaries.zip" -DestinationPath unz
          $src = "unz/Klira_${ver}_binaries"
          New-Item -ItemType Directory build | Out-Null
          foreach ($a in 'x64','x86','arm64') {
            New-Item -ItemType Directory "build/$a" | Out-Null
            Copy-Item "$src/$a/Klira.exe" "build/$a/Klira.exe"
          }
          foreach ($f in 'EULA.txt','THIRD_PARTY_NOTICES.txt','PRIVACY.md','README.md') { Copy-Item "$src/$f" "build/$f" }
          Copy-Item .github/installer/on.ico build/on.ico

      - name: Get WebView2Loader.dll for x64, x86 and ARM64
        shell: pwsh
        run: |
          $idx = Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/index.json'
          $v = @($idx.versions | Where-Object { $_ -notmatch '-' })[-1]
          "Microsoft.Web.WebView2 $v" | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/$v/microsoft.web.webview2.$v.nupkg" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2
          foreach ($a in 'x64','x86','arm64') {
            $dll = "wv2/build/native/$a/WebView2Loader.dll"
            if (-not (Test-Path $dll)) { throw "Нет $dll в пакете" }
            Copy-Item $dll "build/$a/WebView2Loader.dll"
          }
          Copy-Item wv2/LICENSE.txt build/WebView2_LICENSE.txt -ErrorAction SilentlyContinue
          # Inno Setup читает UTF-8 только с BOM
          $ver = (Get-Content .github/installer/VERSION).Trim()
          $utf8bom = New-Object System.Text.UTF8Encoding $true
          $eula = [IO.File]::ReadAllText("$PWD/build/EULA.txt", [Text.Encoding]::UTF8)
          [IO.File]::WriteAllText("$PWD/build/EULA.txt", $eula, $utf8bom)
          $iss = [IO.File]::ReadAllText("$PWD/.github/installer/Klira.iss", [Text.Encoding]::UTF8).Replace('@VERSION@', $ver)
          [IO.File]::WriteAllText("$PWD/build/Klira.iss", $iss, $utf8bom)

      - name: Compile the installer with Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc build\Klira.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Portable archives, checksums, latest.json
        shell: pwsh
        run: |
          $ver = (Get-Content .github/installer/VERSION).Trim()
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "build/Output/Klira_Setup_$ver.exe" out/
          foreach ($a in 'x64','x86','arm64') {
            $d = "pack_$a/Klira"
            New-Item -ItemType Directory $d -Force | Out-Null
            Copy-Item "build/$a/Klira.exe","build/$a/WebView2Loader.dll" $d
            foreach ($f in 'EULA.txt','THIRD_PARTY_NOTICES.txt','PRIVACY.md','README.md') { Copy-Item "build/$f" $d }
            Compress-Archive -Path "pack_$a/Klira" -DestinationPath "out/Klira_${ver}_$a.zip" -CompressionLevel Optimal
          }
          $lines = @()
          foreach ($f in Get-ChildItem out -File | Sort-Object Name) {
            $lines += ((Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $f.Name)
          }
          [IO.File]::WriteAllText("$PWD/out/SHA256SUMS.txt", (($lines -join "`n") + "`n"))
          $h = (Get-FileHash "out/Klira_Setup_$ver.exe" -Algorithm SHA256).Hash.ToLower()
          $json = '{"version":"' + $ver + '","installer":"https://raw.githubusercontent.com/VizitSpace/klira/main/downloads/Klira_Setup_' + $ver + '.exe","sha256":"' + $h + '"}'
          # The list of changes (notes.json) is added to latest.json when it is valid; on any problem
          # the file stays exactly as before, so the update itself can never break because of it.
          try {
            $nf = ".github/installer/notes.json"
            if (Test-Path $nf) {
              $raw = [IO.File]::ReadAllText("$PWD/$nf", [Text.Encoding]::UTF8)
              $null = $raw | ConvertFrom-Json -ErrorAction Stop
              $compact = ($raw -replace '\s*\r?\n\s*', '').Trim()
              $withNotes = $json.Substring(0, $json.Length - 1) + ',"notes":' + $compact + '}'
              $null = $withNotes | ConvertFrom-Json -ErrorAction Stop
              $json = $withNotes
              "notes.json added to latest.json"
            }
          } catch { "notes.json skipped: $_" }
          [IO.File]::WriteAllText("$PWD/out/latest.json", $json + "`n")
          ($lines -join "`n") | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - uses: actions/upload-artifact@v4
        with:
          name: Klira_downloads
          path: out/*
          retention-days: 30

      - name: Publish to downloads/
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force downloads | Out-Null
          Get-ChildItem downloads -File | Where-Object { $_.Name -match '^Klira_(Setup_|[0-9])' } | Remove-Item
          Copy-Item out/* downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f downloads
          git commit -m "Downloads for Klira $((Get-Content .github/installer/VERSION).Trim()) (built by GitHub Actions)"
          git pull --rebase
          git push

      - name: Attach the files to the GitHub release (if it exists)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = (Get-Content .github/installer/VERSION).Trim()
          gh release view "v$ver" --repo ${{ github.repository }} *> $null
          if ($LASTEXITCODE -ne 0) { "Релиза v$ver ещё нет: файлы не прикрепляю."; exit 0 }
          gh release upload "v$ver" (Get-ChildItem out -File | ForEach-Object { $_.FullName }) --clobber --repo ${{ github.repository }}
          if ($LASTEXITCODE -ne 0) { throw "Не удалось прикрепить файлы к релизу" }
