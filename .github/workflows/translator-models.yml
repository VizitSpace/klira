name: Translator models list

# Переводчик Klira работает без интернета, но ему нужны файлы языков (модели Mozilla, лицензия MPL-2.0).
# Этот процесс только читает публичный список моделей Mozilla и показывает, какие пары языков там есть,
# сколько они весят и отдаются ли файлы обычным программам. Ничего не публикует и не меняет в репозитории.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Read the Mozilla model registry
        run: |
          set -e
          url='https://firefox.settings.services.mozilla.com/v1/buckets/main/collections/translations-models/records'
          curl -sS -f -m 60 -o records.json "$url"
          echo "records: $(jq '.data | length' records.json)"
          {
            echo '### Модели Mozilla (из реестра)'
            echo
            echo '| из | в | тип | версия | размер, КБ | файл |'
            echo '|---|---|---|---|---|---|'
            jq -r '.data | sort_by(.fromLang, .toLang, .fileType) | .[]
              | select((.fromLang=="uk" or .toLang=="uk" or .fromLang=="ru" or .toLang=="ru"))
              | "| \(.fromLang) | \(.toLang) | \(.fileType) | \(.version) | \((.attachment.size/1024)|floor) | \(.attachment.location) |"' records.json
          } | tee -a "$GITHUB_STEP_SUMMARY"
          echo
          echo "== all pairs (lang pairs with a model file) =="
          jq -r '.data | map(select(.fileType=="model")) | map("\(.fromLang)->\(.toLang) v\(.version)") | unique | .[]' records.json

      - name: Can a plain program download a file?
        run: |
          set -e
          loc=$(jq -r '.data | map(select(.fileType=="model" and .fromLang=="ru")) | .[0].attachment.location' records.json)
          base=$(curl -sS -f -m 30 'https://firefox.settings.services.mozilla.com/v1/' | jq -r '.capabilities.attachments.base_url')
          echo "base=$base loc=$loc"
          curl -sS -I -m 30 "${base}${loc}" | head -n 12
          {
            echo
            echo '### Проверка скачивания обычной программой'
            echo '```'
            curl -sS -I -m 30 "${base}${loc}" | head -n 8
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: mozilla-registry
          path: records.json
